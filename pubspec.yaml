name: plantguard
description: "PlantGuard - smart care for healthier plants."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.11.4

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8

  # Local key/value storage. The login screen needs this to know whether an
  # account has ever been created on THIS device - that is what decides
  # between the "Welcome Back!" and "Please Log in" greetings. It also keeps
  # the "Remember me" state and saved username between launches. None of this
  # needs a backend, so it works now and stays useful once the database and
  # IoT side are connected.
  shared_preferences: ^2.3.2

  # UI click sounds, the splash whooshes and the looping ambient bed.
  # The app still runs if any audio file is missing - taps fall back to the
  # platform click plus haptics, and anything else goes silent.
  audioplayers: ^6.1.0
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

  # Generates the native Android/iOS launch screen so the app opens straight
  # into the Flutter splash instead of showing the Flutter logo first.
  flutter_native_splash: ^2.4.1

  # Replaces the default Flutter launcher icon with the PlantGuard logo.
  flutter_launcher_icons: ^0.14.1

# ---------------------------------------------------------------------------
# NATIVE LAUNCH SCREEN
# Plain white in both light and dark mode, so the hand-off into splashscreen.dart
# (which opens on white and holds for 600ms) is invisible.
#
# On Android 12+ the system splash cannot be disabled, only styled - so the icon
# is pointed at a fully transparent PNG, which renders it as a plain white screen.
#
# Generate with:  dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#FFFFFF" # keeps it white in dark mode - this is what fixes the black screen
  android: true
  ios: true
  web: false

  android_12:
    color: "#FFFFFF"
    color_dark: "#FFFFFF"
    image: assets/images/splash_blank.png # 288x288 fully transparent - hides the system icon
    image_dark: assets/images/splash_blank.png

# ---------------------------------------------------------------------------
# LAUNCHER ICON
# Generate with:  dart run flutter_launcher_icons
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/plantguard_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/plantguard_logo.png"

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # -------------------------------------------------------------------------
  # ASSETS
  #
  # Both folders now live under assets/. Note the asymmetry in how they are
  # referenced from code:
  #   Image.asset  needs the FULL path -> 'assets/images/background.jpg'
  #   AssetSource  prefixes 'assets/'  -> 'sounds/tap.mp3'
  # That is audioplayers' own convention, not a mistake.
  #
  # Sounds in use (all optional - AppSound falls back to the platform click
  # plus haptics for anything missing):
  #   assets/sounds/tap.mp3            UI click on every button
  #   assets/sounds/success.mp3        confirmations
  #   assets/sounds/error.mp3          rejected input
  #   assets/sounds/splash_shine.mp3   wordmark reveal in the splash
  #   assets/sounds/whoosh1.mp3        logo roll-in
  #   assets/sounds/whoosh2.mp3        logo rise + scale
  #   assets/sounds/ambient_loop.mp3   seamless looping bed
  # -------------------------------------------------------------------------
  assets:
    - assets/images/
    - assets/sounds/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # -------------------------------------------------------------------------
  # FONTS
  #
  # These four weights must exist at project_root/fonts/ or the build fails
  # with "unable to locate asset". Every weight used anywhere in the app is
  # declared here - if you add a FontWeight the list doesn't cover, Flutter
  # synthesises it by stretching the nearest one, which looks subtly wrong.
  #
  #   w400 Regular | w600 SemiBold | w700 Bold | w800 ExtraBold
  #
  # Medium (w500) was dropped - nothing in the app needs it any more, so the
  # project only requires these four files.
  # -------------------------------------------------------------------------
  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
        - asset: fonts/Inter-ExtraBold.ttf
          weight: 800

  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package